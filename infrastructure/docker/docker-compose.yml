services:

  postgres:
    image: postgres:17
    container_name: careerhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: careerhub
      POSTGRES_PASSWORD: careerhub_dev
      POSTGRES_DB: identity_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerhub -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: